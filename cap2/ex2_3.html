<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 2.3</title>
  </head>
  <body>
    <!-- Titulo principal da Página -->
    <h1>Revenda de Veículos JS</h1>

    <!-- Formulários: Entrada de Dados -->
    <p>Veículo: <input type="text" id="inVeiculo" /></p>
    <p>Preço: <input type="text" id="inPreco" /></p>

    <!-- Botão (Aciona a Função)  -->
    <p><input type="button" value="Ver Promoção" id="btVerPromocao" /></p>

    <!-- Saida de Dados -->
    <h3 id="outVeiculo"></h3>
    <h3 id="outEntrada"></h3>
    <h3 id="outParcela"></h3>

    <!-- Link com o Arquivo JavaScript -->
    <script src="/cap2/js/ex2_3.js"></script>
  </body>
</html>
